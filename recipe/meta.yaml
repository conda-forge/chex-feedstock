{% set name = "chex" %}
{% set version = "0.1.91" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/chex-{{ version }}.tar.gz
  sha256: 65367a521415ada905b8c0222b0a41a68337fcadf79a1fb6fc992dbd95dd9f76

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolatio

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - flit-core
  run:
    - typing_extensions >=4.15.0
    - python >={{ python_min }}
    - absl-py >=2.3.1
    - typing-extensions >=4.2.0
    - jax >=0.7.0
    - jaxlib >=0.7.0
    - numpy >=1.24.1
    - toolz >=1.0.0

test:
  imports:
    - chex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/deepmind/chex
  summary: 'Chex: Testing made fun, in JAX!'
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
    - PhilipVinc
    - hbq1
